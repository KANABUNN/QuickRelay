name: iOS distribution readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check App Store SDK requirement
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Run simulator tests
        run: sh ios/Scripts/test.sh
      - name: Build the Release archive without signing credentials
        run: |
          xcodebuild -quiet -project ios/QuakeRelay.xcodeproj -scheme QuakeRelay \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuakeRelay.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=1.0.0 archive
          python3 ios/Scripts/validate-distribution.py bundle \
            "$RUNNER_TEMP/QuakeRelay.xcarchive/Products/Applications/QuakeRelay.app" \
            --bundle jp.kb-dev.quickrelay --build 1.0.0
      - name: Check distribution guardrails
        run: |
          python3 ios/Scripts/test-distribution.py
          bash -n ios/Scripts/testflight.sh
          python3 scripts/verify-repository.py
          python3 scripts/audit-secrets.py
          git diff --check
