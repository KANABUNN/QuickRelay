name: iOS acceptance without a physical device
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - name: Isolated Swift to Go acceptance
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)" -ge 26
          python3 -m unittest discover -s scripts -p 'test_ios_acceptance.py' -v
          python3 scripts/verify-ios-acceptance.py --source-mode candidate
      - name: Save sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-acceptance-evidence
          path: .local/ios-acceptance/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
