name: Upload internal TestFlight build
on:
  push:
    tags: ['testflight-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    if: startsWith(github.ref, 'refs/tags/testflight-')
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release inputs before accessing signing credentials
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
          python3 ios/Scripts/test-distribution.py
          python3 scripts/verify-repository.py
          python3 scripts/audit-secrets.py
          git diff --check
      - name: Allocate a build number above earlier repository releases
        run: |
          python3 - <<'PY'
          import os
          major = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          if major > 9999 or attempt > 99:
              raise SystemExit('Allocate a new reviewed build-number range.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'BUILD_NUMBER={major}.{attempt}.0\n')
          PY
      - name: Sign, validate and upload for internal testing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/Scripts/testflight.sh
      - name: Retain public validation evidence only
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .tmp/testflight/validation.json
            .tmp/testflight/ipa-sha256.txt
          include-hidden-files: true
          retention-days: 30
