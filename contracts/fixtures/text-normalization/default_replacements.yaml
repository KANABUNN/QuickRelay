fixed_replacements: {}

regex_replacements:
  - id: eew
    pattern: '(?<![A-Za-z0-9_])EEW(?![A-Za-z0-9_])'
    replacement: '緊急地震速報'

  - id: magnitude
    pattern: '(?<![A-Za-z0-9_])M[ ]*([0-9]+(?:\.[0-9]+)?)(?![0-9.])'
    replacement: 'マグニチュード、\1'

  - id: depth_km
    pattern: '深さ(?P<particle>は)?[ ]*(?P<number>[0-9]+)[ ]*(?:km|キロメートル)'
    replacement: '深さ\g<particle>、\g<number>キロメートル'

  - id: magnitude_label
    pattern: 'マグニチュード(?P<particle>は)?[ ]*(?P<number>[0-9]+(?:\.[0-9]+)?)(?![0-9.])'
    replacement: 'マグニチュード\g<particle>、\g<number>'

  - id: max_intensity
    pattern: '最大震度(?P<particle>は)?[ ]*(?P<number>[0-7](?:弱|強)?)'
    replacement: '最大震度\g<particle>、\g<number>'

  - id: report_number
    pattern: '第[ ]*([0-9]+)[ ]*報'
    replacement: '第\1報'

  - id: separator_before_magnitude
    pattern: '([0-9]キロメートル)[ ]*[、,][ ]*(?=マグニチュード)'
    replacement: '\1。'

  - id: separator_before_depth
    pattern: '([0-9])[ ]*[、,][ ]*(?=深さ(?:は)?、)'
    replacement: '\1。'
